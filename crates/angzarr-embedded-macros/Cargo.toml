[package]
name = "angzarr-embedded-macros"
version = "0.1.0"
description = "Markup over hand-written aggregates, process managers, policies and projectors that generates their angzarr-embedded glue. Part of angzarr-embedded, angzarr's in-app runtime (embedded in your application, not a microcontroller); for the distributed system see angzarr core, https://github.com/angzarr-io/angzarr."
edition.workspace = true
license.workspace = true
publish.workspace = true
# Its doc tests build angzarr-embedded, which needs 1.89.
rust-version = "1.89"

[lib]
proc-macro = true

# syn, quote and proc-macro2 are compile-time only and already in the graph
# through prost-derive; each is pinned to the version prost-derive resolves
# in Cargo.lock, so adding them adds no new crate (see CLAUDE.md, *Few
# dependencies*).
[dependencies]
proc-macro2 = "=1.0.107"
quote = "=1.0.47"
syn = { version = "=2.0.119", features = ["full"] }

# The doc tests are aggregates on angzarr-embedded, with prost messages as their wire
# types.
[dev-dependencies]
angzarr-embedded = { path = "../angzarr-embedded" }
angzarr-diagnostic = { git = "https://github.com/angzarr-io/angzarr", rev = "d704afc21812225e7c536ef4055bf48a3ef821e9" }
prost = "0.14"

[lints]
workspace = true
